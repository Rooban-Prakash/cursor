[package]
name = "file-manager-widget"
version = "1.0.0"
description = "Desktop file and directory management widget"
authors = ["Rooban"]
edition = "2021"

[lib]
name = "file_manager_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
